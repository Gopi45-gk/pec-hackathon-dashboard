<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <!-- Outer Subtle Glow Ring -->
  <circle cx="80" cy="80" r="76" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4 2" />
  
  <!-- Outer Golden Laurel Wreath Ring -->
  <circle cx="80" cy="80" r="70" fill="#f8fafc" stroke="#d97706" stroke-width="2" />
  
  <!-- College Shield Base -->
  <path d="M42 42 C42 42, 80 34, 118 42 C118 78, 114 112, 80 128 C46 112, 42 78, 42 42 Z" 
        fill="#0b2545" 
        stroke="#c27803" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Shield Inner Accent Border -->
  <path d="M48 48 C48 48, 80 41, 112 48 C112 79, 108 106, 80 120 C52 106, 48 79, 48 48 Z" 
        fill="none" 
        stroke="#1d4ed8" 
        stroke-width="1" 
        stroke-opacity="0.4" />

  <!-- Academic Torch / Knowledge Flame -->
  <path d="M80 50 C76 56, 73 60, 77 66 C79 69, 81 69, 83 66 C87 60, 84 56, 80 50 Z" fill="#f59e0b" />
  <circle cx="80" cy="62" r="2.5" fill="#fef3c7" />

  <!-- Torch Handle Base -->
  <path d="M76 68 L84 68 L82 74 L78 74 Z" fill="#d97706" />

  <!-- Institutional Typography "PEC" -->
  <text x="80" y="93" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, system-ui, sans-serif" 
        font-size="19" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#ffffff">PEC</text>

  <!-- Autonomous Ribbon / Badge -->
  <rect x="52" y="100" width="56" height="12" rx="3" fill="#c27803" />
  <text x="80" y="108.5" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, system-ui, sans-serif" 
        font-size="6.5" 
        font-weight="800" 
        letter-spacing="1" 
        fill="#0b2545">AUTONOMOUS</text>
  
  <!-- Estd Year -->
  <text x="80" y="142" 
        text-anchor="middle" 
        font-family="'Inter', -apple-system, system-ui, sans-serif" 
        font-size="8.5" 
        font-weight="700" 
        letter-spacing="1.5" 
        fill="#64748b">ESTD 2001</text>
</svg>
